<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#0b0d12;color:#f7f7f7;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 15%,#242936 0,#11141b 40%,#08090d 100%)}
  .shell{width:min(1180px,92vw);padding:38px 44px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(11,13,18,.92);box-shadow:0 28px 90px rgba(0,0,0,.5)}

  [dir="rtl"] .fw{margin-left:0;margin-right:auto}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{appearance:none;text-align:left;min-height:245px;border:1px solid rgba(255,255,255,.16);border-radius:24px;background:linear-gradient(145deg,#1a1e28,#11141a);color:#fff;padding:30px;cursor:pointer;transition:.16s transform,.16s border-color,.16s background}
  [dir="rtl"] .card{text-align:right}
  .card:focus,.card:hover{outline:none;transform:scale(1.025);border-color:#fff;background:linear-gradient(145deg,#242a37,#151922)}.card:disabled{opacity:.45;transform:none;cursor:default}
  .mode{font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:#9da8bc;margin-bottom:14px}.name{font-size:31px;font-weight:700;margin-bottom:12px}.author{font-size:18px;color:#c7cedc}.desc{margin-top:22px;font-size:16px;line-height:1.45;color:#aeb7c8}
  .status{margin-top:27px;min-height:54px;padding:15px 18px;border-radius:16px;background:#10131a;border:1px solid rgba(255,255,255,.11);font-size:18px;display:flex;align-items:center}.ok{color:#dfffe5}.warn{color:#ffe9ae}.err{color:#ffb3b3}
  .foot{margin-top:18px;text-align:center;color:#778094;font-size:13px}
</style>
</head>
<body>
<main class="shell">

function phNormalizeLocale(raw){
 let l=String(raw||'en-US').replace('_','-');let lo=l.toLowerCase();
 if(lo.startsWith('zh')) return /tw|hk|mo|hant/.test(lo)?'zh-Hant':'zh-Hans';
 if(lo.startsWith('en')) return /gb|uk/.test(lo)?'en-GB':'en-US';
 if(lo.startsWith('fr')) return /ca/.test(lo)?'fr-CA':'fr-FR';
 if(lo.startsWith('pt')) return /br/.test(lo)?'pt-BR':'pt-PT';
 if(lo.startsWith('es')) return /es$|es-es/.test(lo)?'es-ES':'es-419';
 const map={ar:'ar-SA',cs:'cs-CZ',da:'da-DK',nl:'nl-NL',fi:'fi-FI',de:'de-DE',el:'el-GR',hu:'hu-HU',id:'id-ID',it:'it-IT',ja:'ja-JP',ko:'ko-KR',no:'no-NO',nb:'no-NO',pl:'pl-PL',ro:'ro-RO',ru:'ru-RU',sv:'sv-SE',th:'th-TH',tr:'tr-TR',uk:'uk-UA',vi:'vi-VN'};
 return map[lo.split('-')[0]]||'en-US';
}
const PH_LOCALE=phNormalizeLocale((navigator.languages&&navigator.languages[0])||navigator.language||'en-US');
const PH_T=PH_SELECTOR_I18N[PH_LOCALE]||PH_SELECTOR_I18N['en-US'];
const phText=k=>PH_T[k]||PH_SELECTOR_I18N['en-US'][k]||k;
const phFmt=(k,vars)=>{let s=phText(k);for(const n in vars)s=s.split('{'+n+'}').join(vars[n]);return s;};
document.documentElement.lang=PH_LOCALE;document.documentElement.dir=PH_LOCALE==='ar-SA'?'rtl':'ltr';
document.getElementById('selectorSub').textContent=phText('subtitle');
document.getElementById('selectorBadge').textContent=phText('selector');
document.getElementById('liteMode').textContent=phText('modern');
document.getElementById('drMode').textContent=phText('compat');
document.getElementById('liteDesc').textContent=phText('lite_desc');
document.getElementById('drDesc').textContent=phText('dr_desc');
document.getElementById('selectorFoot').textContent=phText('footer');
const statusEl=document.getElementById('status');statusEl.textContent=phText('waiting');
const liteBtn=document.getElementById('lite');
const drBtn=document.getElementById('dr');
let submitted=false;
function setButtons(disabled){liteBtn.disabled=disabled;drBtn.disabled=disabled;}
function engineName(v){return v==='dr'?'KStuff DR 1.2':'KStuff Lite 1.10';}
async function chooseEngine(choice){
  if(submitted)return;
  submitted=true;setButtons(true);
  statusEl.className='status warn';statusEl.textContent=phFmt('requesting',{engine:engineName(choice)});
  const q=new URLSearchParams({pipe:'0',daemon:'1',path:'/data/PIZZA_HEN/bin/pizzahen-kstuff-select.elf',args:choice});
  try{
    const r=await fetch('/hbldr?'+q.toString(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    statusEl.className='status ok';statusEl.textContent=phFmt('selected',{engine:engineName(choice)});
  }catch(e){
    submitted=false;setButtons(false);statusEl.className='status err';statusEl.textContent=phFmt('failed',{error:e.message});
  }
}
async function readActive(){
  try{
    const r=await fetch('/fs/data/PIZZA_HEN/runtime/kstuff_active.txt?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const v=(await r.text()).trim();
    if(v==='lite'||v==='dr'){
      submitted=true;setButtons(true);statusEl.className='status ok';
      statusEl.textContent=phFmt('active',{engine:engineName(v)});
    }
  }catch(_e){}
}
readActive();setInterval(readActive,1200);
</script>
