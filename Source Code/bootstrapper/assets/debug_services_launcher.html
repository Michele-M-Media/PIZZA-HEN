function phNormalizeLocale(raw){
 let l=String(raw||'en-US').replace('_','-');let lo=l.toLowerCase();
 if(lo.startsWith('zh')) return /tw|hk|mo|hant/.test(lo)?'zh-Hant':'zh-Hans';
 if(lo.startsWith('en')) return /gb|uk/.test(lo)?'en-GB':'en-US';
 if(lo.startsWith('fr')) return /ca/.test(lo)?'fr-CA':'fr-FR';
 if(lo.startsWith('pt')) return /br/.test(lo)?'pt-BR':'pt-PT';
 if(lo.startsWith('es')) return /es$|es-es/.test(lo)?'es-ES':'es-419';
 const map={ar:'ar-SA',cs:'cs-CZ',da:'da-DK',nl:'nl-NL',fi:'fi-FI',de:'de-DE',el:'el-GR',hu:'hu-HU',id:'id-ID',it:'it-IT',ja:'ja-JP',ko:'ko-KR',no:'no-NO',nb:'no-NO',pl:'pl-PL',ro:'ro-RO',ru:'ru-RU',sv:'sv-SE',th:'th-TH',tr:'tr-TR',uk:'uk-UA',vi:'vi-VN'};
 return map[lo.split('-')[0]]||'en-US';
}
const PH_LOCALE=phNormalizeLocale((navigator.languages&&navigator.languages[0])||navigator.language||'en-US');
const PH_T=PH_I18N[PH_LOCALE]||PH_I18N['en-US'];
const phText=k=>PH_T[k]||PH_I18N['en-US'][k]||k;
document.documentElement.lang=PH_LOCALE;document.documentElement.dir=PH_LOCALE==='ar-SA'?'rtl':'ltr';
document.getElementById('title').textContent='PIZZA HEN — '+phText('debug_services');
const statusEl=document.getElementById('status'),retry=document.getElementById('retry');retry.textContent=phText('start');let busy=false;
function setStatus(cls,text){statusEl.className=cls;statusEl.textContent=text}
async function api(args){const q=new URLSearchParams({pipe:'0',daemon:'1',path:'/data/PIZZA_HEN/bin/pizzahen-api.elf',args});const r=await fetch('/hbldr?'+q.toString(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status)}
async function persistLocale(){await api('locale-set '+PH_LOCALE)}
async function readStatus(){try{const r=await fetch('/fs/data/PIZZA_HEN/runtime/toolbox_action_status.txt?ts='+Date.now(),{cache:'no-store'});return r.ok?(await r.text()).trim():''}catch(_e){return ''}}
async function openDebugServices(){if(busy)return;busy=true;retry.disabled=true;setStatus('warn',phText('loading'));
try{await persistLocale();const q=new URLSearchParams({pipe:'0',daemon:'1',path:'/data/PIZZA_HEN/bin/pizzahen-toolbox-open.elf'});const r=await fetch('/hbldr?'+q.toString(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
for(let i=0;i<22;i++){await new Promise(resolve=>setTimeout(resolve,750));const s=await readStatus();if(s==='ok'){setStatus('ok',phText('ready'));busy=false;retry.disabled=false;retry.textContent=phText('start');return}if(s.startsWith('fail:'))throw new Error(s.substring(5));}throw new Error('timeout');}
catch(e){setStatus('err',phText('error')+': '+e.message);busy=false;retry.disabled=false;}}
setTimeout(openDebugServices,500);
